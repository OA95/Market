services:
  mariadb:
    image: mariadb:latest
    container_name: market-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: marketdb
      MARIADB_USER: market_user
      MARIADB_PASSWORD: test
    volumes:
      - mariadb_data:/var/lib/mysql
    

volumes:
  mariadb_data:
